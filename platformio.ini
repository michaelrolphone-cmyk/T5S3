boards_dir = boards
[env:T5_E_PAPER_S3_V7]
; Keep this repo on PlatformIO Espressif32 6.5.0 / Arduino ESP32 2.0.14 / IDF 4.4.x.
; The local epdiy LCD driver uses IDF4 HAL/private symbols and does not build against
; newer Arduino ESP32 3.x / IDF5 split packages such as framework-arduinoespressif32-libs.
platform = https://github.com/platformio/platform-espressif32.git#v6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed =  921600
monitor_speed = 115200
; monitor_port = COM136
monitor_filters = esp32_exception_decoder
; board_build.partition = default_16MB.csv
extra_scripts =
    scripts/patch_display_lifecycle.py
    scripts/patch_button_logging.py

build_flags = 
    -DBOARD_HAS_PSRAM
    -DPSRAM_SPEED=120MHz

    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    -DCORE_DEBUG_LEVEL=5

    ; Move large non-DMA internal heap allocations, such as epdiy's 64K LUT, to PSRAM.
    -Wl,--wrap=heap_caps_malloc

    ; Own WiFi AP/STA/web lifecycle from boot through the existing service-loop call.
    -Wl,--wrap=_Z20ui_wifi_service_loopv

    ; Enable this manually when debugging button electrical state.
    ; -DDEBUG_BUTTON_RAW_LOG=1

    ; -DLOG_PORT=Serial

    -DDISABLE_ALL_LIBRARY_WARNINGS

    -Wl,--gc-sections

lib_deps =
    ; lvgl/lvgl@8.4.0
    ; lewisxhe/SensorLib@0.2.2
    ; lewisxhe/XPowersLib@^0.2.7
    Wire
    SPI
    bitbank2/PNGdec
